const oc=$('#oc'),ox=oc.getContext('2d'),W=960,H=540;

 R(c,345,204,270,10,'#c98a58');R(c,345,214,270,32,'#a0643a');R(c,360,194,26,10,'#fff');R(c,420,186,32,6,'#ffb3c8');R(c,420,190,32,14,'#6b3a22');
 R(c,720,40,170,52,'#ffcf40');R(c,724,44,162,44,'#3a2431');txt(c,'ЯНДЕКС',805,62,9,'#ffcf40','center');txt(c,'ДОСТАВКА',805,80,9,'#ffcf40','center');

function update(dt){for(const c of cs){if(c.state==='drag'){c.mv=false;continue}

 if(d>2){c.x+=dx/d*sp*dt;c.y+=dy/d*sp*dt;c.mv=true;if(Math.abs(dx)>1)c.face=dx<0?-1:1;if(c.state==='enter'&&((c.st=(c.st||0)+dt)>.3)){c.st=0;tone(130,.05,'square',.04)}}
 else{c.mv=false;if(c.state==='enter'||c.state==='go')c.state='idle';else if(c.state==='leave')c.dead=true;else if((c.wait-=dt)<=0){const zx=c.z*320;c.tx=clamp(c.x+(Math.random()-.5)*140,zx+30,zx+290);c.ty=clamp(c.y+(Math.random()-.5)*100,300,500);c.wait=2+Math.random()*4}}}
 if(cur&&cur.dead){cur=null;render()}if(cs.some(c=>c.dead)){cs=cs.filter(c=>!c.dead);save()}coins.forEach(p=>{p.t+=dt;p.y-=32*dt});coins=coins.filter(p=>p.t<1.8)}
const P=e=>{const r=oc.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
const hit=p=>cs.filter(c=>c.state!=='leave'&&Math.abs(p.x-c.x)<=18&&p.y>=c.y-54&&p.y<=c.y+6).sort((a,b)=>b.y-a.y)[0]||null;
oc.addEventListener('pointerdown',e=>{const p=P(e),c=hit(p);if(!c)return;drag={c,id:e.pointerId,sx:p.x,sy:p.y,dx:c.x-p.x,dy:c.y-p.y,mv:false};oc.setPointerCapture(e.pointerId);tone(500,.04)});
oc.addEventListener('pointermove',e=>{const p=P(e);if(drag){const d=drag;if(!d.mv&&Math.hypot(p.x-d.sx,p.y-d.sy)>8){d.mv=true;d.c.state='drag';cur=null;render()}if(d.mv){d.c.x=clamp(p.x+d.dx,20,W-20);d.c.y=clamp(p.y+d.dy,150,H-6)}}else hover=hit(p);oc.style.cursor=drag&&drag.mv?'grabbing':(hover||drag)?'grab':'default'});
function release(){if(!drag)return;const d=drag,c=d.c;drag=null;if(!d.mv){cur=c;tone(660,.05);render();return}
 let z=clamp(Math.floor(c.x/320),0,2);if(z===1&&c.z!==1&&!useStock(c))z=c.z;c.state='idle';c.x=clamp(c.x,z*320+30,z*320+290);c.tx=c.x;c.y=clamp(c.y,300,500);c.ty=c.y;c.wait=2;setZ(c,z,false);tone(300,.06);render()}
oc.addEventListener('pointerup',release);oc.addEventListener('pointercancel',release);oc.addEventListener('pointerleave',()=>{if(!drag)hover=null});
/* ---------- карточка заказа ---------- */
const row=(a,b,k)=>'<div class="row'+(k||'')+'"><span>'+a+'</span><b>'+b+'</b></div>';
async function send(c){const i=$('#tm'),t=i.value.trim();if(!t){i.focus();return}i.value='';tone(880,.05);setTimeout(()=>tone(1319,.09),60);
 try{const m=await api('/api/admin/orders/'+c.id+'/reply',{method:'POST',body:JSON.stringify({text:t})});pushMsg(c,m);log('→ '+c.nick+': '+t)}
 catch(e){i.value=t;toast('Сообщение не доставлено. Проверьте связь и что клиент не заблокировал бота')}}
function render(){const m=$('#m'),c=cur;if(!c){m.hidden=true;lastId=0;return}
 if(lastId!==c.id){lastId=c.id;tab='order';delete m.dataset.k;
  m.innerHTML='<div class="cd"><button class="btn x" id="mx" aria-label="Закрыть">✖</button><div class="hd"><i style="background:'+c.av+'">'+c.nick[1].toUpperCase()+'</i><div><a href="https://t.me/'+c.nick.replace('@','')+'" target="_blank" rel="noopener">'+c.nick+'</a><br><small id="stt"></small></div></div>'+
  '<div class="tabs"><button data-t="order">📋 Заказ</button><button data-t="chat">💬 Диалог Telegram</button></div>'+
  '<div class="pane" id="p-order">'+c.rows.map(r=>row(r[0],r[1])).join('')+row('К оплате','🪙 '+money(c.price),' t')+'<div class="bt"><button id="b1">✅ Принять заказ</button><button id="b2">👨‍🍳 Отправить на кухню</button><button id="b3">🛵 Вызвать курьера</button><button id="b4">💬 Ответить в Telegram</button></div></div>'+
  '<div class="pane" id="p-chat"><div id="cl"></div><div class="tg"><input id="tm" placeholder="Ответить в Telegram..." autocomplete="off"><button id="bs">ОТПРАВИТЬ</button></div></div></div>'}
 m.hidden=false;$('#stt').textContent=ST[c.z]+(c.acc?' · принят':'');$('#b1').disabled=c.acc;$('#b2').disabled=c.z===1;$('#b3').disabled=c.z!==2;
 m.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));m.querySelectorAll('.pane').forEach(p=>{const on=p.id==='p-'+tab;if(on!==p.classList.contains('on'))p.classList.toggle('on',on)});
 const k=c.msgs.length+':'+(c.typing?1:0);if(m.dataset.k!==k){const first=m.dataset.k===undefined,L=$('#cl');m.dataset.k=k;L.textContent='';
  c.msgs.forEach((g,i)=>{const d=document.createElement('div'),s=document.createElement('small');d.className='msg'+(g.f==='m'?' me':'')+(!first&&!c.typing&&i===c.msgs.length-1?' new':'');d.textContent=g.t;s.textContent=g.h;d.append(s);L.append(d)});
  if(c.typing){const d=document.createElement('div');d.className='msg ty';d.textContent='печатает…';L.append(d)}L.scrollTop=L.scrollHeight}}
$('#m').onclick=e=>{const b=e.target.closest('button');if(!b||!cur){if(e.target.id==='m'){cur=null;render()}return}const c=cur;
 if(b.dataset.t){if(tab!==b.dataset.t){tab=b.dataset.t;tone(784,.04);render();if(tab==='chat')$('#cl').scrollTop=1e6}return}tone(660,.05);
 if(b.id==='mx')cur=null;else if(b.id==='b1'){if(!c.acc){c.acc=true;G.q.acc++;gain(10);log(c.nick+': заказ принят');say(c,'Ура, спасибо!');save();syncStatus(c)}}
 else if(b.id==='b2')toKitchen(c,true);else if(b.id==='b3')courier(c);else if(b.id==='b4'){tab='chat';render();$('#cl').scrollTop=1e6;$('#tm').focus();return}else if(b.id==='bs'){send(c);return}render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){cur=null;render();$('#pn').hidden=true}else if(e.key==='Enter'&&e.target.id==='tm'&&cur){e.preventDefault();send(cur)}});
/* ---------- связь с сервером: REST + WebSocket ---------- */
const API=SHOP_CONFIG.apiUrl,TGW=window.Telegram&&Telegram.WebApp,INIT=TGW?TGW.initData:'';
if(TGW){TGW.ready();TGW.expand()}
async function api(path,opt){const r=await fetch(API+path,Object.assign({headers:{'Content-Type':'application/json','X-Init-Data':INIT}},opt));if(!r.ok)throw new Error(r.status);return r.json()}
const ZONE={new:0,accepted:0,work:1,ready:2};
const statusOf=c=>c.done?'done':c.z===0?(c.acc?'accepted':'new'):c.z===1?'work':'ready';
function syncStatus(c){api('/api/admin/orders/'+c.id,{method:'PATCH',body:JSON.stringify({status:statusOf(c)})}).catch(()=>toast('Нет связи с сервером: статус не сохранён'))}
function pushMsg(c,m){if(c.msgs.some(x=>x.id===m.id))return;c.msgs.push(m);if(cur===c)render()}
function leave(c){if(c.done)return;c.done=true;c.state='leave';c.tx=1000;c.ty=clamp(c.y,330,470)}
function upsert(o,enter){let c=cs.find(x=>x.id===o.id);if(o.status==='done'){if(c)leave(c);return null}
 const z=ZONE[o.status];
 if(!c){const id=o.id;c=Object.assign({},o,{z,acc:o.status!=='new',done:false,cons:z>0?1:0,col:COL[id%6],sk:SK[id%3],hr:HR[id%4],av:COL[(id+2)%6],state:enter?'enter':'idle',x:enter?-20:z*320+60+Math.random()*200,y:enter?410:320+Math.random()*160,wait:Math.random()*3,mv:false,face:1,msgs:[]});
  c.tx=enter?100+Math.random()*180:c.x;c.ty=enter?330+Math.random()*130:c.y;cs.push(c);(o.messages||[]).forEach(m=>pushMsg(c,m));return c}
 c.acc=o.status!=='new';if(c.z!==z){c.z=z;c.state='go';c.tx=z*320+60+Math.random()*200;c.ty=330+Math.random()*140}
 (o.messages||[]).forEach(m=>pushMsg(c,m));return null}
async function load(){try{const list=await api('/api/admin/orders'),ids=new Set(list.map(o=>o.id));list.forEach(o=>upsert(o,false));cs.forEach(c=>{if(!ids.has(c.id))leave(c)})}catch(e){toast('Не удалось загрузить заказы')}}
function online(on){const e=$('#net');e.textContent=on?'🟢 онлайн':'🔴 нет связи';}
let ws,retry=0;
function connect(){ws=new WebSocket(API.replace(/^http/,'ws')+'/ws?init_data='+encodeURIComponent(INIT));
 ws.onopen=()=>{retry=0;online(true);load()};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.type==='order_new'){if(upsert(m.order,true)){bell();log('🔔 Новый заказ '+m.order.nick+': '+m.order.short+', '+money(m.order.price))}}
  else if(m.type==='order_update')upsert(m.order,false);
  else if(m.type==='chat'){const c=cs.find(x=>x.id===m.order_id);if(c){pushMsg(c,m.message);if(m.message.f==='c'){say(c,m.message.t.slice(0,28));log('← '+c.nick+': '+m.message.t);tone(659,.06,'triangle',.07)}}}};
 ws.onclose=()=>{online(false);setTimeout(connect,Math.min(15000,1000*2**retry++))};ws.onerror=()=>ws.close()}
setInterval(()=>{if(ws&&ws.readyState===1)ws.send('ping')},25000);
$('#spawn').onclick=async()=>{const free=NICKS.filter(n=>!cs.some(c=>c.nick===n));try{await api('/api/admin/simulate',{method:'POST',body:JSON.stringify({order:orderOf(randState(rnd(free.length?free:NICKS)))})})}catch(e){toast('Сервер недоступен')}};
$('#snd').onclick=()=>{snd=!snd;$('#snd').textContent=snd?'🔊 ЗВУК: ВКЛ':'🔇 ЗВУК: ВЫКЛ';tone(880,.06)};
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;update(dt);drawOwner();requestAnimationFrame(loop)}
$('#ttl').innerHTML=SHOP_CONFIG.name+'<small>Кабинет · '+SHOP_CONFIG.city+' · '+SHOP_CONFIG.metro+'</small>';document.title='Кабинет · '+SHOP_CONFIG.name;
hud();online(false);connect();log(SHOP_CONFIG.name+': кабинет открыт. Новые заказы приходят сюда мгновенно.');
requestAnimationFrame(loop);if(document.fonts&&document.fonts.load)document.fonts.load('8px "Press Start 2P"');
</script></body></html>
